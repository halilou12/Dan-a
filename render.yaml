services:
  - type: web
    name: barista-api
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    healthCheckPath: /api/health
    buildCommand: npm ci && npm run build
    startCommand: npm start
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: barista-db
          property: connectionString
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: barista-db
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: '17'
    databaseName: barista
    user: barista
