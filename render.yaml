services:
  - type: web
    name: barista-api
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    buildCommand: npm run build
    startCommand: npm start
    disk:
      name: barista-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: DATABASE_PATH
        value: /var/data/ksb.db
      - key: UPLOAD_DIR
        value: /var/data/uploads/gallery
      - key: JWT_SECRET
        generateValue: true