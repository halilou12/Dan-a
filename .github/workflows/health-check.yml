name: Health check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live site
        id: ping
        continue-on-error: true
        run: |
          START=$(date +%s)
          HTTP_CODE=$(curl -sS -o /tmp/health-body -w '%{http_code}' --max-time 60 \
            https://barista-api-xufj.onrender.com/api/health || echo 000)
          END=$(date +%s)
          echo "code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "elapsed=$((END - START))s" >> "$GITHUB_OUTPUT"
          echo "HTTP $HTTP_CODE in $((END - START))s"
          cat /tmp/health-body || true

      - name: Open an issue if down
        if: steps.ping.outcome == 'failure' || steps.ping.outputs.code != '200'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'outage',
            });
            if (open.length > 0) {
              core.info('An outage issue is already open; skipping.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Site down: health check failed (HTTP ${context.payload.steps.ping.outputs.code || '000'})`,
              labels: ['outage'],
              body: [
                'The scheduled health check failed.',
                '',
                `- **Time (UTC):** ${new Date().toISOString()}`,
                `- **Status code:** ${context.payload.steps.ping.outputs.code || '000'}`,
                `- **Elapsed:** ${context.payload.steps.ping.outputs.elapsed || 'n/a'}`,
                `- **Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Check the Render dashboard (service logs / deploy status) first.',
                'Close this issue once the site is back.',
              ].join('\n'),
            });

      - name: Close stale outage issue when healthy again
        if: steps.ping.outcome == 'success' && steps.ping.outputs.code == '200'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'outage',
            });
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
