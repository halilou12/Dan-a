# Netlify config: builds the Vite frontend, deploys the Express API as a
# serverless function, and stores uploaded gallery images in Netlify Blobs.
#
# Environment variables to set in the Netlify UI (Site settings -> Environment
# variables):
#   DATABASE_URL  = postgres connection string (e.g. Neon, with ?sslmode=require)
#   JWT_SECRET    = long random string (keep sessions valid across cold starts)
#   ADMIN_USERS   = JSON array of admin accounts (optional seed)
#   APP_URL       = https://kigali-barista.app (for password-reset links)
#   SMTP_*        = optional SMTP settings for password-reset emails
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Bundle the Express API as a Netlify Function.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "pg"]

# Route API calls to the serverless function (same-origin from the browser's
# point of view, so no CORS setup is needed).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Serve admin-uploaded images through the function (Netlify Blobs).
[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200
  force = true

# SPA fallback: let the React router handle client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
